  apple.com: 2.8
  kubernetes.io: 2.8
  dl.k8s.io: 3.0
  api.github.com: 2.9
  nvidianews.nvidia.com: 2.7
  wccftech.com: 3.0
  tomshardware.com: 2.6
  servethehome.com: 0.7
  swpc.noaa.gov: 2.8
  spaceweather.com: 2.6
  wired.com: 2.5
  pcmag.com: 2.4
  rting: 2.4
  anandtech.com: 2.3
  nobelprize.org: 2.7
  bbc.co.uk: 2.2
  wikipedia.org: 2.1
  endoflife.date: 0.8
  ddg: 1.0

# ─────────────────────────────────────────────────────────────────────────────
# TIMEOUTS - seconds
# ─────────────────────────────────────────────────────────────────────────────
timeouts:
  classify: 0.8
  ddg: 4.0
  enrich: 5.0
  rewrite: 1.5
  fetch_candidate: 3.0
  passage_extract: 2.0

# Circuit breaker config
circuit_breaker:
  failure_threshold: 3  # consecutive failures before disabling
  cooldown_seconds: 60  # how long to skip disabled backend

# Enrichment thresholds
enrich:
  min_snippet_length: 40
  enrich_snippet_min: 150
  fetch_chars: 800
  max_workers: 3

