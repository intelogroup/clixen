# ─────────────────────────────────────────────────────────────────────────────
# AUTHORITATIVE DATA SOURCES - identity, authority, domain-specific data
# ─────────────────────────────────────────────────────────────────────────────
# These are high-authority sources that can be used for entity resolution,
# identity verification, and domain-specific queries.

authoritative_data_sources:
  # Researcher identity - ORCID
  # Note: API requires specific field (family-name, given-name, etc.)
  orcid:
    name: "ORCID"
    description: "Open Researcher and Contributor ID - unique author identifiers"
    base_url: "https://pub.orcid.org/v3.0"
    # Use field-specific queries: family-name:Smith, orcid:0000-0001-2345-6789
    search_url: "https://pub.orcid.org/v3.0/search/?q=family-name:{q}"
    keywords: [orcid, researcher id, author id, scholar id, researcher, author, academic]

  # Organization identity - ROR
  ror:
    name: "ROR"
    description: "Research Organization Registry - unique institution IDs"
    base_url: "https://api.ror.org"
    query_url: "https://api.ror.org/organizations?query={q}"
    keywords: [ror, research organization, institution, university, lab, research institute]

  # Name authority - VIAF
  # Note: API returns XML/HTML (no native JSON), search uses CQL syntax
  viaf:
    name: "VIAF"
    description: "Virtual International Authority File - linked names across libraries"
    base_url: "https://viaf.org"
    # VIAF requires CQL syntax, returns XML. Use web search for better experience.
    search_url: "https://viaf.org/viaf/search?query=local.personalNames+all+\"{q}\"&httpAccept=application/xml"
    keywords: [viaf, authority, library, name authority, worldcat, author, person]

  # US drug/medical data - OpenFDA
  openfda:
    name: "OpenFDA"
    description: "FDA drugs, labels, recalls, devices, adverse events"
    base_url: "https://api.fda.gov"
    # Use openfda.brand_name for drug searches, activeingredient for ingredients
    drugs_url: "https://api.fda.gov/drug/label.json?search=openfda.brand_name:{q}&limit=3"
    recalls_url: "https://api.fda.gov/drug/enforcement.json?search=description:{q}&limit=3"
    adverse_url: "https://api.fda.gov/drug/event.json?search=patient.drug.openfda.brand_name:{q}&limit=3"
    keywords: [fda, openfda, drug, drug recall, adverse event, label, prescription, medication]

  # Economic data - World Bank
  worldbank:
    name: "World Bank Data"
    description: "Country-level economic and development indicators"
    base_url: "https://api.worldbank.org/v2"
    query_url: "https://api.worldbank.org/v2/country?format=json&per_page=50&search={q}"
    keywords: [world bank, gdp, development, economic indicator, country data]

  # Curated datasets - Our World in Data
  owid:
    name: "Our World in Data"
    description: "Curated datasets across health, energy, climate, population"
    base_url: "https://ourworldindata.org"
    search_url: "https://ourworldindata.org/search?q={q}"
    keywords: [our world in data, owid, climate, energy, population, health]

  # International stats - UN Data
  # Note: Complex SDMX API - use web search for simple queries
  undata:
    name: "UN Data"
    description: "Multi-agency international statistics (UNSD)"
    base_url: "https://data.un.org"
    # UN Data REST API: /ws/rest/data/DF_UNDATA_SDG/{indicator}?format=json
    # For simple queries, use the explorer/browse interface
    search_url: "https://data.un.org/Handlers/DownloadHandler.ashx?DataSetId={q}"
    keywords: [un data, united nations, international stats, unsd, un statistics]

  # Europe-focused stats - Eurostat
  # Note: requires specific dataset code (e.g., tipsun20 for unemployment, nama_10_gdp for GDP)
  eurostat:
    name: "Eurostat"
    description: "European Union official statistics"
    base_url: "https://ec.europa.eu/eurostat/api/dissemination"
    # Dataset: tipsun20 = unemployment rate (annual), une_rt_m = unemployment (monthly)
    unemployment_url: "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/tipsun20?geo={q}&time=2024&format=JSON"
    # General pattern: /statistics/1.0/data/{dataset}?geo={country}&time={year}
    keywords: [eurostat, eu statistics, europe data, euro area, unemployment, gdp]

  # LLM model metadata - basellm/llm-metadata (free static API)
  # Note: contains pricing, context, capabilities - NOT benchmark scores (those require separate API)
  llm_metadata:
    name: "LLM Metadata"
    description: "Model pricing, context, capabilities for 4300+ models (no benchmark data)"
    base_url: "https://basellm.github.io/llm-metadata/api/newapi"
    models_url: "https://basellm.github.io/llm-metadata/api/newapi/models.json"
    vendors_url: "https://basellm.github.io/llm-metadata/api/newapi/vendors.json"
    keywords: [gpt, claude, gemini, deepseek, llama, qwen, mistral, model pricing, benchmark, llm comparison]