<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title></title>
  <style>
    /* Full-screen, transparent, click-through overlay: it only ever draws the
       flying cursor. Rust sets ignore_cursor_events, so it never eats a click. */
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="module" src="/src/cursor.js"></script>
</body>
</html>
