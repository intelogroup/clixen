[package]
name = "clixen-orb"
version = "0.1.0"
edition = "2021"
description = "Clixen floating voice orb — a UI-less overlay that lives on top of your pages"

[lib]
name = "clixen_orb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "clixen-orb"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-nspanel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
futures-util = "0.3"
base64 = "0.22"
tauri-plugin-global-shortcut = "2.4.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
