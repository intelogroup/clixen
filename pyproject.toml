[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "clixen"
version = "0.1.0"
description = "Local LLM tools harness, chat UI, and deterministic search agent."
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.10,<4",
  "beautifulsoup4>=4.14,<5",
  "ddgs>=9,<10",
  "exa-py>=2,<3",
  "fastapi>=0.124,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "langgraph>=1.1,<2",
  "langgraph-checkpoint>=4,<5",
  "langgraph-checkpoint-sqlite>=3.1.1,<4",
  "ollama>=0.6,<1",
  "tavily-python",
  "pydantic>=2.12,<3",
  "requests>=2.33,<3",
  "trafilatura>=2.0,<3",
  "uvicorn>=0.33,<1",
  "python-docx>=1,<2",
  "docx2python>=3.7,<4",
  "tantivy>=0.26,<1",
  "openpyxl>=3.1,<4",
  "pdfplumber",
  "firecrawl-anydoc>=0.1.2,<1",
  "markdown>=3.7,<4",
  "lancedb",
  "python-multipart",
  "python-telegram-bot",
  "faster-whisper",
  # kokoro-onnx's own deps include phonemizer-fork/espeakng-loader/pykakasi
  # (GPL-3.0) — tools-harness/tools/misaki_tokenizer.py stubs them out at
  # runtime so they're never actually imported/executed, using misaki
  # (Apache-2.0) instead. `uv sync` may still pull them onto disk since
  # kokoro-onnx's metadata declares them; strip explicitly before a Tauri
  # bundle so the GPL bytes aren't shipped at all.
  "kokoro-onnx",
  "misaki[en]",
  # misaki's spacy G2P model — pinned by direct wheel URL, not a bare name,
  # because spacy models aren't on PyPI proper; without this pin, first TTS
  # call would silently `spacy download` over the network (breaks offline/
  # sandboxed installs).
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "onnxruntime",
  "sqlalchemy",
  "google-auth",
  "google-auth-oauthlib",
  "google-auth-httplib2",
  "google-api-python-client",
  "twscrape[curl,browser] @ git+https://github.com/intelogroup/twscrape.git@clixen-fixes",
  "resemblyzer>=0.1.4",
  "paper-qa>=5.0.0",
  "reportlab>=4.0.0",
  "scrapling[fetchers]>=0.4.0",
  "setuptools<81",  # pkg_resources removed in 81+, webrtcvad (resemblyzer dep) still imports it
  "mcp>=2.0.0",
  "pillow>=12.3.0",
  "lxml>=6.1.0",
  "urllib3>=2.7.0",
  "langchain-core>=1.3.3",
  "langsmith>=0.8.18",
  "python-pptx>=1,<2",
  "matplotlib>=3.9,<4",
  "cryptography>=49.0.1",
  "pypdf>=6.14.3",
]

[project.optional-dependencies]
test = [
  "pytest>=9,<10",
]
dev = [
  "ruff>=0.15,<0.16",
]
structured = [
  "instructor>=1,<2",
]
pii = [
  # already resolved transitively via misaki's en-core-web-sm wheel pin above;
  # declared explicitly here so the version contract isn't an accident.
  # <3.8.14: 3.8.14+ dropped cp314 wheels (source-only), breaking resolution
  # on the project's CPython 3.14 venv — pin stays put until upstream ships one.
  "spacy>=3.8,<3.8.14",
]
ocr = [
  "opencv-python-headless>=4.10",
  "pytesseract>=0.3",
  "paddlepaddle>=3.0",
  "paddleocr>=3.0",
]
data = [
  "pandas",
  "numpy",
  "polars",
  "scipy",
  "statsmodels",
  "pingouin",
  "matplotlib",
  "seaborn",
  "plotly",
  "great-tables",
  "duckdb",
  "jupyter_client",
  "ipykernel",
  "kaleido",
  "lifelines",
]

[tool.pytest.ini_options]
pythonpath = [
  "src",
  "tools-harness",
]
addopts = [
  "--import-mode=importlib",
]
asyncio_mode = "auto"
markers = [
  "live: needs Ollama / network / external creds / a running server (auto-skipped when deps are down; run with `pytest -m live`)",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["tools-harness"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "artifacts",
  "cloudflare-worker",
  "docs",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4",
]
