version: 2

# Weekly, grouped: one PR per ecosystem instead of one per package. Security
# updates ignore `schedule` and land immediately — that is what closed the 144
# alerts, so keeping the signal low-noise matters more than the cadence.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      root-js:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /clixen-orb
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      orb-js:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /tools-harness
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      harness-js:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /google-mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      google-mcp-js:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # spacy models are pinned by direct wheel URL, not a bare name (see the
      # comment in pyproject.toml: without the pin, the first TTS call would run
      # `spacy download` over the network and break offline use). Dependabot
      # treats a GitHub release asset as a private source and fails the ENTIRE
      # run with "private_source_authentication_failure" — which blocked every
      # other Python update, not just this one. It can never bump a URL pin
      # anyway, so it should not try. Bump by hand when 3.8.x models move.
      - dependency-name: "en-core-web-sm"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /clixen-orb/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
