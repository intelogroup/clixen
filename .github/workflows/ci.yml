name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pure renderer logic + the Playwright harness. Everything here is mocked at
  # the Tauri IPC boundary, so it runs on a plain Linux runner.
  orb-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clixen-orb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clixen-orb/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:web
      - run: python3 -m pip install --upgrade pip playwright
      - run: python3 -m playwright install --with-deps chromium
      # package.json's test:ui honours $PYTHON so CI does not need the uv venv.
      - run: PYTHON=python3 npm run test:ui

  # The VAD/session logic needs only numpy, onnxruntime and webrtcvad — no
  # macOS, no torch, no docling. The speech fixture is committed, so these run
  # on Linux instead of skipping for lack of a system voice.
  #
  # The injection fence is in here on purpose: it imports only
  # tools.injection_guard (stdlib), and it is the check that guards against a page
  # closing the untrusted-content block early to smuggle instructions through.
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip numpy onnxruntime pytest webrtcvad-wheels httpx
      - run: PYTHONPATH=tools-harness python -m pytest tools-harness/tests/voice/test_vad.py tools-harness/tests/voice/test_session.py -q
      - run: PYTHONPATH=tools-harness python -m pytest tools-harness/tests/test_injection_fence.py -q

  # The crate is macOS-only (NSPanel, objc2), and tauri-build needs the web
  # bundle to exist before cargo compiles.
  orb-rust:
    runs-on: macos-14
    defaults:
      run:
        working-directory: clixen-orb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clixen-orb/package-lock.json
      - run: npm ci
      - run: npm run build:web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clixen-orb/src-tauri
      # Includes the ACL test that walks every #[tauri::command] and asserts it
      # is registered in build.rs and granted by a capability.
      - run: cargo test --manifest-path src-tauri/Cargo.toml
